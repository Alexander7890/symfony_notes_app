framework:
  secret: '%env(APP_SECRET)%'
  http_method_override: true

  session:
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax

  php_errors:
    log: true

  router:
    utf8: true

  csrf_protection: true

  default_locale: en

  translator:
    default_path: '%kernel.project_dir%/translations'
    fallbacks: ['en']
