doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    driver: 'pdo_sqlite'
    charset: utf8

  orm:
    auto_generate_proxy_classes: true
    default_entity_manager: default

    entity_managers:
      default:
        connection: default
        mappings:
          App:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Entity'
            alias: App